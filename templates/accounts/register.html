{% extends "base.html" %}
{% block title %}Sign Up - Short Link Service{% endblock %}

{% block content %}
<div class="bg-slate-900/70 border border-white/10 rounded-2xl p-6 md:p-8 shadow-lg max-w-xl mx-auto">
	<h2 class="text-2xl text-center p-4 font-semibold mb-4">Join Short Link Service</h2>
	<form method="post" class="space-y-4">
		{% csrf_token %}
		{{ form.as_p }}
		<button type="submit" class="bg-blue-600 text-white px-5 py-2.5 rounded-lg hover:bg-blue-500">Sign Up</button>
	</form>
</div>
{% endblock %}
