{% extends "base.html" %}
{% block title %}Delete - Short Link {% endblock %}

{% block content %}
<div class="mb-6">
    <a href="{% url 'slinks:dashboard' %}" class="text-slate-300 hover:text-white">&larr; Back to Dashboard</a>
</div>
<div class="bg-slate-900/70 border border-white/10 rounded-2xl p-6 md:p-8 shadow-lg">
    <h2 class="text-2xl font-semibold mb-4">Delete Short Link</h2>
    <p class="text-slate-300">Are you sure you want to delete the short link for <strong class="text-slate-100">{{ link.original_url }}</strong>?</p>
    <form method="post" class="mt-6 flex items-center gap-4">
        {% csrf_token %}
        <button type="submit" class="bg-red-600 text-white px-5 py-2.5 rounded-lg hover:bg-red-500">Delete Short Link</button>
        <a href="{% url 'slinks:dashboard' %}" class="text-slate-300 hover:text-white">Cancel</a>
    </form>
</div>
{% endblock %}
