{% extends "base.html" %}
{% block title %}Create - Short Link{% endblock %}

{% block content %}
<div class="mb-6">
    <a href="{% url 'slinks:dashboard' %}" class="text-slate-300 hover:text-white">&larr; Back to Dashboard</a>
</div>
<div class="bg-slate-900/70 border border-white/10 rounded-2xl p-6 md:p-8 shadow-lg">
    <h2 class="text-2xl font-semibold mb-4">Create a Short Link</h2>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="bg-blue-600 text-white px-5 py-2.5 rounded-lg hover:bg-blue-500">Create Short Link</button>
    </form>
</div>
{% endblock %}
